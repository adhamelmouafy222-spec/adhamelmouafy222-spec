name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # يشتغل كل 6 ساعات تلقائيًا
  workflow_dispatch:         # وممكن تشغله يدوي من تاب Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate green neon snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300ff41&color_dots=%23001a0d,%23003d1f,%23006633,%2300b359,%2300ff41
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300ff41&color_dots=%23001a0d,%23003d1f,%23006633,%2300b359,%2300ff41

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
